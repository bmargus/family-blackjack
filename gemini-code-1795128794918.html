<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Casino Blackjack</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --felt: #0b5d33;
      --felt-dark: #063b20;
      --gold: #f5c542;
      --gold-dark: #c9971a;
      --red: #e63946;
      --blue: #2b7de9;
      --green: #2ec4b6;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at center, var(--felt) 0%, var(--felt-dark) 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: rgba(0, 0, 0, 0.55);
      border-bottom: 3px solid var(--gold);
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.12);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 1.2rem;
    }

    input[type="range"] {
      width: 110px;
      height: 10px;
      cursor: pointer;
      accent-color: var(--gold);
    }

    .btn-end {
      background: var(--red);
      color: white;
      border: 3px solid #fff;
      padding: 10px 20px;
      font-size: 1.15rem;
      font-weight: 900;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 #8f1d26;
    }
    .btn-end:active { transform: translateY(3px); box-shadow: none; }

    /* MAIN LAYOUT */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 270px;
      gap: 16px;
      padding: 16px;
      flex: 1;
    }

    @media (max-width: 950px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    /* DEALER STAGE */
    .dealer-zone {
      background: rgba(0, 0, 0, 0.35);
      border: 3px solid var(--gold);
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .dealer-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
    }

    .dealer-avatar {
      font-size: 4.2rem;
      background: #1d1d1d;
      border: 4px solid var(--gold);
      border-radius: 50%;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: dealerBob 2s infinite ease-in-out;
    }

    @keyframes dealerBob {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-6px) rotate(3deg); }
    }

    .speech-bubble {
      background: #fff;
      color: #111;
      padding: 14px 22px;
      border-radius: 20px;
      font-size: 1.35rem;
      font-weight: 800;
      max-width: 550px;
      position: relative;
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      left: -14px;
      top: 50%;
      transform: translateY(-50%);
      border-width: 10px 14px 10px 0;
      border-style: solid;
      border-color: transparent #fff transparent transparent;
    }

    /* CARDS */
    .cards-row {
      display: flex;
      gap: 10px;
      min-height: 112px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 8px 0;
    }

    .card {
      width: 76px;
      height: 108px;
      background: #fff;
      border-radius: 10px;
      color: #111;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px 8px;
      font-size: 1.45rem;
      font-weight: 900;
      box-shadow: 0 5px 12px rgba(0,0,0,0.45);
      animation: cardDeal 0.3s ease-out;
    }

    @keyframes cardDeal {
      from { transform: translateY(-40px) scale(0.7) rotate(-10deg); opacity: 0; }
      to { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
    }

    .card.red { color: #d90429; }
    .card.back {
      background: repeating-linear-gradient(45deg, #b5179e, #b5179e 10px, #7209b7 10px, #7209b7 20px);
      border: 3px solid #fff;
    }
    .card-center { font-size: 2.1rem; text-align: center; }

    .badge-total {
      background: #111;
      color: var(--gold);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 1.25rem;
      font-weight: 900;
      border: 2px solid var(--gold);
    }

    /* PLAYERS ARENA */
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }

    .seat {
      background: rgba(0, 0, 0, 0.42);
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .seat.active-turn {
      border-color: var(--gold);
      box-shadow: 0 0 25px rgba(245, 197, 66, 0.75);
      transform: scale(1.03);
    }

    .seat.my-seat {
      background: rgba(245, 197, 66, 0.14);
    }

    .seat-avatar {
      font-size: 3.4rem;
      line-height: 1;
      margin-bottom: 4px;
    }

    .seat-name {
      font-size: 1.35rem;
      font-weight: 900;
    }

    .seat-chips {
      font-size: 1.2rem;
      color: var(--gold);
      font-weight: 800;
    }

    .seat-bet {
      background: #1f4e78;
      padding: 4px 12px;
      border-radius: 12px;
      margin-top: 4px;
      font-weight: 800;
      font-size: 1.1rem;
    }

    .status-banner {
      margin-top: 6px;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 900;
      text-transform: uppercase;
    }
    .status-WIN, .status-BLACKJACK { background: #2a9d8f; color: #fff; }
    .status-LOSE, .status-BUST { background: var(--red); color: #fff; }
    .status-PUSH, .status-STAND { background: #555; color: #fff; }

    /* ESCALATING BUST ANIMATIONS */
    .bust-mild {
      animation: wobbleMild 0.7s ease-in-out 2;
      border-color: #ff9f1c !important;
    }
    @keyframes wobbleMild {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-6deg); }
      75% { transform: rotate(6deg); }
    }

    .bust-medium {
      animation: shakeMedium 0.5s ease-in-out 3;
      border-color: #ff5400 !important;
      background: rgba(230, 57, 70, 0.45) !important;
    }
    @keyframes shakeMedium {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(-12px, 8px) scale(1.06); }
      50% { transform: translate(12px, -8px) scale(0.95); }
      75% { transform: translate(-10px, -6px) scale(1.05); }
    }

    .bust-extreme {
      animation: nuclearBust 0.6s ease-in-out 4;
      border-color: #ff0000 !important;
      box-shadow: 0 0 45px #ff0000 !important;
      background: rgba(255, 0, 0, 0.65) !important;
    }
    @keyframes nuclearBust {
      0% { transform: scale(1) rotate(0deg); filter: hue-rotate(0deg); }
      25% { transform: scale(1.18) rotate(-12deg); filter: hue-rotate(90deg); }
      50% { transform: scale(0.85) rotate(12deg); filter: invert(1); }
      75% { transform: scale(1.15) rotate(-8deg); }
      100% { transform: scale(1) rotate(0deg); filter: none; }
    }

    .bust-overlay-emoji {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 3.2rem;
      pointer-events: none;
      animation: popEmoji 0.6s infinite alternate;
    }
    @keyframes popEmoji {
      from { transform: scale(0.9) rotate(-10deg); }
      to { transform: scale(1.3) rotate(10deg); }
    }

    /* GIANT EASY-TO-CLICK ACTION BAR */
    .action-bar {
      background: rgba(0, 0, 0, 0.72);
      border-top: 3px solid var(--gold);
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      min-height: 105px;
    }

    .big-btn {
      min-width: 155px;
      min-height: 74px;
      font-size: 1.65rem;
      font-weight: 900;
      border: 4px solid #fff;
      border-radius: 20px;
      cursor: pointer;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.55);
      transition: transform 0.1s;
    }
    .big-btn:active { transform: translateY(4px); box-shadow: none; }
    .big-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-hit { background: #16a34a; }
    .btn-stand { background: #dc2626; }
    .btn-double { background: #d97706; }
    .btn-deal { background: #2563eb; }
    .btn-chip {
      min-width: 115px;
      min-height: 74px;
      border-radius: 50px;
      font-size: 1.5rem;
      font-weight: 900;
      border: 5px dashed #fff;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0,0,0,0.5);
    }
    .chip-25 { background: #1d4ed8; }
    .chip-50 { background: #b91c1c; }
    .chip-100 { background: #111827; border-color: var(--gold); color: var(--gold); }

    /* LEADERBOARD SIDEBAR */
    .leaderboard {
      background: rgba(0, 0, 0, 0.5);
      border: 3px solid var(--gold);
      border-radius: 20px;
      padding: 16px;
      height: fit-content;
    }

    .lb-title {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--gold);
      text-align: center;
      margin-bottom: 12px;
      border-bottom: 2px solid rgba(255,255,255,0.2);
      padding-bottom: 8px;
    }

    .lb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 800;
    }

    /* MODAL OVERLAY (HOST SETUP / SEAT PICKER / GAME OVER) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .modal-card {
      background: #143622;
      border: 4px solid var(--gold);
      border-radius: 28px;
      padding: 30px;
      max-width: 650px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
    }

    .modal-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 20px;
    }

    .toggle-grid {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .player-toggle {
      padding: 20px 26px;
      font-size: 1.6rem;
      font-weight: 900;
      border-radius: 20px;
      border: 4px solid #666;
      background: #222;
      color: #aaa;
      cursor: pointer;
      min-width: 165px;
    }

    .player-toggle.selected {
      background: #16a34a;
      border-color: #fff;
      color: #fff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <div class="top-bar">
    <div class="brand">🎰 FAMILY BLACKJACK</div>
    <div class="controls-right">
      <div class="volume-box">
        <span>🔊</span>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="0.8" />
      </div>
      <button class="btn-end" onclick="confirmEndGame()">🛑 END GAME</button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-grid">
    <div>
      <!-- DEALER AREA -->
      <div class="dealer-zone">
        <div class="dealer-header">
          <div class="dealer-avatar" id="dealerFace">🤵</div>
          <div class="speech-bubble" id="dealerSpeech">Welcome to the table!</div>
        </div>
        <div class="badge-total" id="dealerTotal">DEALER: 0</div>
        <div class="cards-row" id="dealerCards"></div>
      </div>

      <!-- PLAYERS TABLE -->
      <div class="players-grid" id="playersGrid"></div>
    </div>

    <!-- LEADERBOARD -->
    <div class="leaderboard">
      <div class="lb-title">🏆 LEADERBOARD</div>
      <div id="leaderboardList"></div>
    </div>
  </div>

  <!-- GIANT ACTION BUTTONS -->
  <div class="action-bar" id="actionBar"></div>

  <!-- MODAL FOR LOBBY / SEAT CLAIM / GAME OVER -->
  <div class="modal-backdrop" id="modalBackdrop" style="display:none;">
    <div class="modal-card" id="modalContent"></div>
  </div>

  <script>
    const socket = io();
    let currentState = null;
    let myPlayerId = localStorage.getItem('bj_myPlayerId') || null;
    let hostSelection = ['Brad', 'Jarrett', 'Quinn'];
    let lastSpokenLine = '';

    // --- SOUND & VOICE ENGINE ---
    const volumeSlider = document.getElementById('volumeSlider');
    let audioCtx = null;

    function getVolume() {
      return parseFloat(volumeSlider.value);
    }

    function speakDealer(text) {
      const vol = getVolume();
      if (vol <= 0.01 || !('speechSynthesis' in window)) return;
      if (text === lastSpokenLine) return;
      lastSpokenLine = text;

      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.volume = vol;
      utter.rate = 1.08;
      utter.pitch = 1.15;
      window.speechSynthesis.speak(utter);
    }

    function playTone(type) {
      const vol = getVolume();
      if (vol <= 0.01) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      gain.gain.setValueAtTime(vol * 0.3, now);

      if (type === 'chip') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(1800, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.start(now);
        osc.stop(now + 0.09);
      } else if (type === 'card') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'bust') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(65, now + 0.55);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.58);
        osc.start(now);
        osc.stop(now + 0.58);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.12);
        osc.frequency.setValueAtTime(783.99, now + 0.24);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.start(now);
        osc.stop(now + 0.45);
      }
    }

    // --- RENDER HELPERS ---
    function renderCardHTML(card) {
      if (card.hidden) {
        return `<div class="card back"></div>`;
      }
      const cls = card.isRed ? 'card red' : 'card';
      return `
        <div class="${cls}">
          <div>${card.value}${card.suit}</div>
          <div class="card-center">${card.suit}</div>
          <div style="text-align:right">${card.value}${card.suit}</div>
        </div>
      `;
    }

    function toggleHostName(name) {
      if (hostSelection.includes(name)) {
        if (hostSelection.length > 2) {
          hostSelection = hostSelection.filter((n) => n !== name);
        }
      } else {
        hostSelection.push(name);
      }
      renderModal();
    }

    function startHostedGame() {
      if (hostSelection.length >= 2 && hostSelection.length <= 3) {
        socket.emit('hostSetup', hostSelection);
      }
    }

    function claimMySeat(id) {
      myPlayerId = id;
      localStorage.setItem('bj_myPlayerId', id);
      socket.emit('claimSeat', id);
    }

    function confirmEndGame() {
      socket.emit('endGame');
    }

    function renderModal() {
      const backdrop = document.getElementById('modalBackdrop');
      const content = document.getElementById('modalContent');

      if (!currentState) return;

      // 1. LOBBY: Host picks Brad, Jarrett, Quinn (2 or 3 players)
      if (currentState.phase === 'LOBBY') {
        backdrop.style.display = 'flex';
        const names = [
          { id: 'Brad', icon: '😎' },
          { id: 'Jarrett', icon: '🧢' },
          { id: 'Quinn', icon: '🧔' }
        ];
        content.innerHTML = `
          <div class="modal-title">🎰 WHO IS PLAYING?</div>
          <div style="font-size:1.25rem; margin-bottom:18px; color:#ddd;">
            Tap 2 or 3 players (+ 🤓 Nerd & 🤠 Cowboy bots)
          </div>
          <div class="toggle-grid">
            ${names.map((n) => `
              <button class="player-toggle ${hostSelection.includes(n.id) ? 'selected' : ''}"
                      onclick="toggleHostName('${n.id}')">
                ${n.icon} ${n.id}
              </button>
            `).join('')}
          </div>
          <button class="big-btn btn-hit" style="margin:0 auto; width:260px;" onclick="startHostedGame()">
            ▶️ START TABLE
          </button>
        `;
        return;
      }

      // 2. SEAT CLAIM: If human hasn't picked their seat yet on this browser
      const validSeat = currentState.players.find((p) => p.id === myPlayerId && p.type === 'human');
      if (!validSeat && currentState.phase !== 'GAME_OVER') {
        backdrop.style.display = 'flex';
        const humans = currentState.players.filter((p) => p.type === 'human');
        content.innerHTML = `
          <div class="modal-title">🪑 PICK YOUR SEAT</div>
          <div class="toggle-grid">
            ${humans.map((h) => `
              <button class="player-toggle selected" onclick="claimMySeat('${h.id}')">
                ${h.avatar} ${h.name}
              </button>
            `).join('')}
          </div>
        `;
        return;
      }

      // 3. GAME OVER PODIUM
      if (currentState.phase === 'GAME_OVER') {
        backdrop.style.display = 'flex';
        const sorted = [...currentState.players].sort((a, b) => b.chips - a.chips);
        const medals = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'];
        content.innerHTML = `
          <div class="modal-title">🏆 FINAL RESULTS</div>
          <div style="margin-bottom:22px;">
            ${sorted.map((p, idx) => `
              <div class="lb-row" style="font-size:1.45rem;">
                <span>${medals[idx] || ''} ${p.avatar} ${p.name}</span>
                <span style="color:var(--gold);">$${p.chips}</span>
              </div>
            `).join('')}
          </div>
          <button class="big-btn btn-deal" style="margin:0 auto; width:260px;" onclick="socket.emit('resetLobby')">
            🔄 NEW GAME
          </button>
        `;
        return;
      }

      backdrop.style.display = 'none';
    }

    function renderGame() {
      if (!currentState) return;

      // Dealer updates
      const moods = { happy: '🤵', laugh: '🤣', shocked: '😱', smug: '😏' };
      document.getElementById('dealerFace').textContent = moods[currentState.dealerMood] || '🤵';
      document.getElementById('dealerSpeech').textContent = currentState.dealerLine;
      speakDealer(currentState.dealerLine);

      document.getElementById('dealerTotal').textContent =
        currentState.dealer.status === 'BUST'
          ? `DEALER: ${currentState.dealer.total} 💥 BUST!`
          : `DEALER: ${currentState.dealer.total}`;

      document.getElementById('dealerCards').innerHTML =
        currentState.dealer.cards.map(renderCardHTML).join('');

      // Players Grid
      const grid = document.getElementById('playersGrid');
      grid.innerHTML = currentState.players.map((p, idx) => {
        const isTurn = currentState.phase === 'PLAYER_TURN' && currentState.activePlayerIndex === idx;
        const isMe = p.id === myPlayerId;

        // Escalating bust classes
        let bustClass = '';
        let bustEmoji = '';
        if (p.bustOverBy > 0) {
          if (p.bustOverBy <= 2) {
            bustClass = 'bust-mild';
            bustEmoji = '😵';
          } else if (p.bustOverBy <= 5) {
            bustClass = 'bust-medium';
            bustEmoji = '💥🔥';
          } else {
            bustClass = 'bust-extreme';
            bustEmoji = '☢️💀🚀';
          }
        }

        const badgeClass = p.status.includes('WIN') || p.status === 'BLACKJACK'
          ? 'status-WIN'
          : (p.status === 'LOSE' || p.status === 'BUST')
            ? 'status-LOSE'
            : 'status-PUSH';

        return `
          <div class="seat ${isTurn ? 'active-turn' : ''} ${isMe ? 'my-seat' : ''} ${bustClass}">
            ${bustEmoji ? `<div class="bust-overlay-emoji">${bustEmoji}</div>` : ''}
            <div class="seat-avatar">${p.avatar}</div>
            <div class="seat-name">${p.name} ${isMe ? '(YOU)' : ''}</div>
            <div class="seat-chips">💰 $${p.chips}</div>
            <div class="seat-bet">BET: $${p.bet}</div>
            <div class="cards-row">${p.cards.map(renderCardHTML).join('')}</div>
            ${p.total > 0 ? `<div class="badge-total">${p.total}</div>` : ''}
            ${p.status ? `<div class="status-banner ${badgeClass}">${p.status}</div>` : ''}
          </div>
        `;
      }).join('');

      // Leaderboard
      const sorted = [...currentState.players].sort((a, b) => b.chips - a.chips);
      document.getElementById('leaderboardList').innerHTML = sorted.map((p, idx) => `
        <div class="lb-row">
          <span>#${idx + 1} ${p.avatar} ${p.name}</span>
          <span style="color:var(--gold);">$${p.chips}</span>
        </div>
      `).join('');

      // Giant Action Bar
      const bar = document.getElementById('actionBar');
      const me = currentState.players.find((p) => p.id === myPlayerId);

      if (currentState.phase === 'BETTING' && me) {
        if (me.betConfirmed) {
          bar.innerHTML = `<div style="font-size:1.6rem; font-weight:900; color:var(--gold);">⏳ WAITING FOR OTHER BETS...</div>`;
        } else {
          bar.innerHTML = `
            <button class="btn-chip chip-25" onclick="socket.emit('addBet', {playerId:'${me.id}', amount:25})">+$25</button>
            <button class="btn-chip chip-50" onclick="socket.emit('addBet', {playerId:'${me.id}', amount:50})">+$50</button>
            <button class="btn-chip chip-100" onclick="socket.emit('addBet', {playerId:'${me.id}', amount:100})">+$100</button>
            <button class="big-btn btn-stand" onclick="socket.emit('clearBet', '${me.id}')">✖ CLEAR</button>
            <button class="big-btn btn-hit" ${me.bet <= 0 ? 'disabled' : ''} onclick="socket.emit('confirmBet', '${me.id}')">✅ DEAL ($${me.bet})</button>
          `;
        }
      } else if (currentState.phase === 'PLAYER_TURN' && me) {
        const activePlayer = currentState.players[currentState.activePlayerIndex];
        if (activePlayer && activePlayer.id === me.id) {
          const canDouble = me.cards.length === 2 && me.chips >= me.bet;
          bar.innerHTML = `
            <button class="big-btn btn-hit" onclick="socket.emit('action', {playerId:'${me.id}', type:'HIT'})">🃏 HIT</button>
            <button class="big-btn btn-stand" onclick="socket.emit('action', {playerId:'${me.id}', type:'STAND'})">✋ STAND</button>
            <button class="big-btn btn-double" ${!canDouble ? 'disabled' : ''} onclick="socket.emit('action', {playerId:'${me.id}', type:'DOUBLE'})">2️⃣ DOUBLE</button>
          `;
        } else {
          bar.innerHTML = `<div style="font-size:1.6rem; font-weight:900;">👀 ${activePlayer ? activePlayer.name.toUpperCase() : ''}'S TURN</div>`;
        }
      } else if (currentState.phase === 'ROUND_OVER') {
        bar.innerHTML = `
          <button class="big-btn btn-deal" style="min-width:260px;" onclick="socket.emit('nextRound')">
            ➡️ NEXT HAND
          </button>
        `;
      } else {
        bar.innerHTML = `<div style="font-size:1.5rem; font-weight:800;">🎰 DEALER IN ACTION...</div>`;
      }

      renderModal();
    }

    socket.on('stateUpdate', ({ state, sound }) => {
      currentState = state;
      if (sound) playTone(sound);
      renderGame();
    });
  </script>
</body>
</html>
